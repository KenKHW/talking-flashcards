<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__LESSON_TITLE__｜族語圖卡</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6ef;color:#2a4337;font:16px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:30px auto;padding:20px}h1{font-size:27px;margin:8px 0}h2{font-size:21px}p{color:#849278}button{font:inherit;cursor:pointer;border:1px solid #dce3d0;border-radius:9px;background:#fffefa;color:#527545;padding:12px 18px}button:focus-visible{outline:3px solid #bc9e63}button:disabled{opacity:.4;cursor:not-allowed}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.active,.primary{background:#285444;color:white;border-color:#285444}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}.panel{background:#fffefa;border:1px solid #e3e5d8;border-radius:14px;padding:24px}.scene{position:relative;aspect-ratio:4/3}.scene img{width:100%;height:100%;object-fit:cover;border-radius:9px}.pin{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;padding:0;border:3px solid white;border-radius:50%;background:#537e55cc;color:white}.done{background:#bb9858}.answer{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:12px 0}.answer small{display:block;color:#869875}.letter{font-weight:bold}.question{background:#edf3e5;padding:15px;border-radius:8px;margin:16px 0}.question p{margin:5px 0}.hint{display:block;margin:18px auto;font-size:13px;text-decoration:underline;border:0;background:none}.primary{width:100%}progress{width:100%;height:9px;accent-color:#789366}.feedback{padding:12px;background:#f4efdf;border-radius:8px;margin:15px 0}.tiny{font-size:12px;color:#96a38b}#status{font-size:12px;color:#99a58e}.empty{text-align:center;padding:60px 10px}.complete{padding:20px;text-align:center;background:#f6efdd;border-radius:9px;margin-top:20px}@media(max-width:720px){main{margin:10px auto;padding:12px}.grid{display:block}.panel{padding:17px;margin-bottom:18px}.top{display:block}.tabs{margin-top:15px}h1{font-size:23px}}
.question-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.question-tabs button{flex:1 1 65px;min-width:65px;padding:10px 4px;font-size:14px}.answer strong{white-space:nowrap;font-size:15px;font-weight:500}#status{display:flex;align-items:center;gap:8px;min-height:24px}.spinner{width:17px;height:17px;display:inline-block;border:2px solid #d5dec9;border-top-color:#285444;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}</style></head><body><main id="app"></main><script id="lesson-data" type="application/json">__LESSON_DATA__</script><script>
const lesson=JSON.parse(document.getElementById('lesson-data').textContent);const questionTotal=lesson.cards.reduce((n,c)=>n+c.hotspots.length,0);let accepted=false,finished=false;let ci=0,qi=0,answer=null,reveal=false,solved=new Set(),feedback='',audio=null,audioBusy=false,audioStatus='',audioTimer=null,audioStarted=0,audioVersion=0;const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stop(){audioVersion++;clearInterval(audioTimer);audioTimer=null;audioBusy=false;audioStatus='';if(audio){audio.onended=null;audio.onerror=null;audio.pause();audio.removeAttribute('src');audio.load();audio=null;}}
function updateAudio(){const el=document.getElementById('status');if(el){el.innerHTML=audioBusy?`<span class="spinner" aria-hidden="true"></span> ${esc(audioStatus)} · 已等待 ${Math.floor((Date.now()-audioStarted)/1000)} 秒`:esc(audioStatus);el.setAttribute('aria-busy',String(audioBusy));}document.querySelectorAll('[data-audio-control]').forEach(b=>b.disabled=audioBusy);const b=document.querySelector('[data-action="confirm"]');if(b)b.disabled=answer===null||audioBusy;}
async function play(f){stop();const version=audioVersion;let source=lesson.audio[f.audioKey];if(source?.startsWith('data:')){const body=source.slice(source.indexOf(',')+1),head=atob(body.slice(0,24));if(head.slice(0,4)==='RIFF'&&head.slice(8,12)==='WAVE')source='data:audio/wav;base64,'+body;}if(!source){audioStatus='這一句尚未準備語音。';updateAudio();return;}audioBusy=true;audioStatus='正在載入語音';audioStarted=Date.now();updateAudio();audioTimer=setInterval(updateAudio,1000);audio=document.getElementById('lesson-audio-player')||Object.assign(document.createElement('audio'),{id:'lesson-audio-player',hidden:true});if(!audio.isConnected)document.body.append(audio);audio.src=source;audio.load();audio.onended=()=>{if(version===audioVersion){audioStatus='播放完畢';updateAudio();}};audio.onerror=()=>{if(version===audioVersion){audioBusy=false;clearInterval(audioTimer);audioStatus='音檔無法播放，請重新下載教材。';updateAudio();}};try{await audio.play();if(version!==audioVersion)return;audioBusy=false;clearInterval(audioTimer);audioStatus='正在播放';updateAudio();}catch(error){if(version===audioVersion){audioBusy=false;clearInterval(audioTimer);audioStatus=error.name==='NotAllowedError'?'瀏覽器未允許播放，請再按播放或在瀏覽器開啟教材。':error.name==='NotSupportedError'?'音檔無法解碼，請下載最新版教材。':'播放失敗：'+error.name; updateAudio();}}}
function render(){if(finished){app.innerHTML='<section class="panel empty"><h1>練習完成！</h1><p>所有問題都答對了。</p><button class="primary" data-action="restart">再練習一次</button></section>';return;}const c=lesson.cards[ci],h=c.hotspots[qi];app.innerHTML=`<div class="top"><div><span class="tiny">會說話的族語情境圖卡 · 完整教材</span><h1>${esc(lesson.title||lesson.cards.map(c=>c.topic).join(' × '))}</h1><p>${esc(lesson.voice.replaceAll('_',' · '))}</p></div><div class="tabs">${lesson.cards.map((c,i)=>`<button data-action="card" data-i="${i}" class="${ci===i?'active':''}">圖卡 ${i+1} · ${c.level}</button>`).join('')}</div></div><div class="grid"><section class="panel"><h2>${esc(c.topic)}</h2><div class="scene"><img src="${c.customImage}" alt="${esc(c.topic)}情境圖"></div><p class="tiny">選擇問題，再按「播放問題」。</p><progress value="${solved.size}" max="${questionTotal}" aria-label="完成進度"></progress><p class="tiny">${solved.size} / ${questionTotal} 題完成</p>${solved.size===questionTotal?'<div class="complete">所有問題都完成了！<br><button data-action="restart">再練習一次</button></div>':''}</section><section class="panel" id="question-panel"><div class="question-tabs" role="group" aria-label="選擇問題">${c.hotspots.map((_,i)=>`<button data-action="question" data-i="${i}" class="${qi===i?'active':''}" aria-pressed="${qi===i}">問題 ${i+1}${solved.has(ci+'-'+i)?' ✓':''}</button>`).join('')}</div><span class="tiny">圖卡 ${ci+1} · 問題 ${qi+1}</span><h2>聽一聽，選一選</h2><button data-action="replay" class="primary" data-audio-control>▶ 播放問題</button><p id="status" role="status" aria-live="polite"></p>${reveal?`<div class="question"><strong>${esc(h.question.text)}</strong><p>${esc(h.question.chinese||h.question.mtChinese)}</p></div>`:''}<p class="tiny">點選項聽語音，選好後按「確認答案」。</p>${h.options.map((f,i)=>`<button class="answer ${answer===i?'active':''}" data-action="answer" data-i="${i}" data-audio-control aria-pressed="${answer===i}"><strong>選項 ${String.fromCharCode(65+i)}</strong>${reveal?`<span>${esc(f.text)}<small>${esc(f.chinese||f.mtChinese)}</small></span>`:''}</button>`).join('')}<button data-action="reveal" class="hint">${reveal?'隱藏':'顯示'}文字／翻譯</button>${feedback?`<div class="feedback" role="status">${feedback}</div>`:''}${accepted?`<button data-action="next" class="primary">${solved.size===questionTotal?'完成練習 ✓':'下一題 →'}</button>`:`<button data-action="confirm" class="primary" ${answer===null||audioBusy?'disabled':''}>確認答案 →</button>`}</section></div><p class="tiny">圖片與語音已包含在這份教材中，不需連線合成。</p>`;updateAudio();}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='card'){accepted=false;stop();ci=Number(b.dataset.i);qi=0;answer=null;feedback='';reveal=false;render();}if(a==='question'){accepted=false;stop();qi=Number(b.dataset.i);answer=null;feedback='';reveal=false;render();}if(a==='answer'){accepted=false;answer=Number(b.dataset.i);feedback='';render();play(lesson.cards[ci].hotspots[qi].options[answer]);}if(a==='replay')play(lesson.cards[ci].hotspots[qi].question);if(a==='reveal'){reveal=!reveal;render();}if(a==='confirm'){if(answer===lesson.cards[ci].hotspots[qi].correct){solved.add(ci+'-'+qi);accepted=true;feedback='✓ 答對了！也試著自己說說看。';}else feedback='再聽一次，換個答案試試看。';render();}if(a==='next'){stop();let next=null;const items=lesson.cards.flatMap((c,i)=>c.hotspots.map((_,j)=>({c:i,q:j})));const start=items.findIndex(x=>x.c===ci&&x.q===qi);for(let n=1;n<=items.length;n++){const item=items[(start+n)%items.length];if(!solved.has(item.c+'-'+item.q)){next=item;break;}}if(next){ci=next.c;qi=next.q;answer=null;reveal=false;feedback='';accepted=false;}else finished=true;render();}if(a==='restart'){accepted=false;finished=false;stop();solved=new Set();qi=0;answer=null;reveal=false;feedback='';render();}});render();

</script></body></html>
